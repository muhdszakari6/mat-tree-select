<mat-form-field appearance="outline">
  <mat-select [placeholder]="placeholder" [multiple]="multiple" (selectionChange)='selectionChanged.emit(select)'
    [(ngModel)]="select" (ngModelChange)="selectChange.emit(select)">
    <ng-content></ng-content>

    <mat-tree class="example-tree mat-tree-position" [dataSource]="nestedDataSource" [treeControl]="nestedTreeControl">
      <!-- This is the tree node template for leaf nodes -->
      <mat-tree-node class="mat-tree-node" *matTreeNodeDef="let node">
        <mat-option [title] = "node.name" [value]="node">
          <!-- use a disabled button to provide padding for tree leaf -->
          <p style="margin-left: 35px;" class="tree_text"> {{node.name}} </p>
        </mat-option>
      </mat-tree-node>
      <!-- This is the tree node template for expandable nodes -->
      <!-- <mat-option> -->
      <mat-nested-tree-node *matTreeNodeDef="let node; when: hasNestedChild">
        <div style="display: flex">
          <button class="tree-toggle" mat-icon-button matTreeNodeToggle [attr.aria-label]="'toggle ' + node.name">
            <mat-icon class="mat-icon-rtl-mirror">
              {{nestedTreeControl.isExpanded(node) ? 'expand_more' : 'chevron_right'}}
            </mat-icon>
          </button>
          <mat-option [title] = "node.name"  [disabled] = "!canSelectParentNode" style="display: flex;" class="mat-tree-node" [value]="node">

            {{node.name}}
          </mat-option>

        </div>

        <ul [class.example-tree-invisible]="!nestedTreeControl.isExpanded(node)">
          <p *ngIf="heading !== ''" class="title"> {{heading + " " + node.name}}</p>
          <ng-container matTreeNodeOutlet></ng-container>
        </ul>

      </mat-nested-tree-node>
      <!-- </mat-option> -->
    </mat-tree>

  </mat-select>


</mat-form-field>
