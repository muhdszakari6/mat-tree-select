name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets release.yml run the same checks and publish the package they tested.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build (Angular 19)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:ci
      - name: Build library
        run: npm run build
      - name: Check package contents
        run: |
          for file in README.md LICENSE CHANGELOG.md package.json; do
            test -f "dist/mat-tree-select-input/$file" || { echo "Missing $file in package"; exit 1; }
          done
          npm pack --dry-run ./dist/mat-tree-select-input
      - name: Build demo apps
        run: npm run build:demos
      - uses: actions/upload-artifact@v4
        with:
          name: package
          path: dist/mat-tree-select-input

  compatibility:
    # The published package is built with Angular 19; check it and the test suite on later versions.
    name: Angular ${{ matrix.angular }}
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        angular: [20, 21, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: dist/mat-tree-select-input
      - name: Install Angular ${{ matrix.angular }}
        run: node scripts/use-angular-version.mjs ${{ matrix.angular }}
      - run: npm run test:ci
      - name: Build demo apps against the Angular 19 package
        run: npm run build:demos
