name: Release

# Publishes to npm when a GitHub release is published (not on push).
# Uses npm trusted publishing: no npm token is stored in the repository. One-time setup on
# npmjs.com: package settings > Trusted publishing > GitHub Actions, with repository
# muhdszakari6/mat-tree-select and workflow release.yml.

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      # The exact package that CI built and tested on Angular 19-22.
      - uses: actions/download-artifact@v4
        with:
          name: package
          path: package
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use npm with trusted publishing support
        run: npm install -g npm@^11.5.1
      - name: Check that the release tag matches the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          VERSION=$(node -p "require('./package/package.json').version")
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package version $VERSION. Update projects/mat-tree-select-input/package.json or the tag."
            exit 1
          fi
      - name: Publish
        env:
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # Pre-releases go to the "next" dist-tag so `npm install mat-tree-select-input` keeps getting the stable version.
          if [ "$PRERELEASE" = "true" ]; then
            npm publish ./package --tag next
          else
            npm publish ./package
          fi
